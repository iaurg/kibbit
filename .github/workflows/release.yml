name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Test, build & publish
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: ./scripts/test.sh

      - name: Build universal app
        env:
          TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: VERSION="${TAG#v}" UNIVERSAL=1 ./scripts/build-app.sh

      - name: Package & test installer
        run: ./scripts/package.sh

      # Fixed asset names so install.sh can use releases/latest/download/Kibbit.zip.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/Kibbit.zip dist/Kibbit.zip.sha256 \
            --title "Kibbit $TAG" --generate-notes
