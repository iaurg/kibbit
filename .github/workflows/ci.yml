name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: ./scripts/test.sh

      - name: Bundle app
        run: ./scripts/build-app.sh

      - name: Verify bundle
        run: |
          APP=build/Kibbit.app
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$APP/Contents/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "dev.kibbit.Kibbit"
          test -s "$APP/Contents/Resources/AppIcon.icns"
          codesign --verify --strict --verbose=2 "$APP"
          # The release binary must launch and render every sprite.
          "$APP/Contents/MacOS/Kibbit" --render-gallery pets.png
          test -s pets.png

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Kibbit-${{ github.sha }}
          path: |
            build/Kibbit.app
            pets.png
          retention-days: 14
